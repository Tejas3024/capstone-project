version: '3.9'

services:
  backend:
    build: ./backend
    container_name: backend-service
    ports:
      - "5000:5000"
    networks:
      - capstone-network

  frontend:
    build: ./frontend
    container_name: frontend-service
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - capstone-network

networks:
  capstone-network:
    driver: bridge
